name: telegram
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: garden-telegram
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config user.name "garden-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: run
        run: node lib/cli.ts telegram
        env:
          GARDEN_BOT_TOKEN: ${{ secrets.GARDEN_BOT_TOKEN }}
          GARDEN_CHAT_ID: ${{ secrets.GARDEN_CHAT_ID }}
          GARDEN_DENYLIST: ${{ secrets.GARDEN_DENYLIST }}
  # A push made with the workflow's own token does not start pages.yml, so deploy from here.
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed != '' && needs.ingest.outputs.changed != '0'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
